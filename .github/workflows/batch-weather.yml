name: Batch - Weather (30분)

on:
  schedule:
    - cron: '15,45 * * * *'   # 다른 캐시 배치와 겹치지 않게 30분 간격 실행 (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geumdan-weather-cache
  cancel-in-progress: false

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: 기상청 날씨 수집 → DB·Storage 복구 캐시 저장
        run: node scripts/batch/fetch-weather.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}

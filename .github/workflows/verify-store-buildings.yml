name: Verify Store Buildings

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *" # 매일 03:30 KST
  push:
    paths:
      - "scripts/batch/verify-building-register.mjs"
      - "scripts/batch/enrich-vworld-building-register.mjs"
      - ".github/workflows/verify-store-buildings.yml"

permissions:
  contents: write

concurrency:
  group: verify-store-buildings
  cancel-in-progress: true

jobs:
  verify-building-register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: 필수 공식 API 키 확인
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY KAKAO_REST_API_KEY DATA_GO_KR_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name GitHub Actions secret이 비어 있습니다."
              missing=1
            fi
          done
          exit "$missing"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      - name: 신도시 건물 도형에 건축물대장 층수·용도 결합
        run: node scripts/batch/enrich-vworld-building-register.mjs
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          BUILDING_REGISTER_CONCURRENCY: "12"
          MIN_BUILDING_FOOTPRINT_AREA: "180"
      - name: 검증된 지도 데이터를 현재 브랜치에 저장
        shell: bash
        run: |
          if git diff --quiet -- public/data/geumdan-vworld-buildings.geojson; then
            echo "건축물대장 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/geumdan-vworld-buildings.geojson
          git commit -m "data: refresh Geumdan building register geometry"
          git push
      - name: 공식 건축물대장 기반 상가 건물 층수 검증
        continue-on-error: true
        run: node scripts/batch/verify-building-register.mjs --apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      - name: 동일 도로명주소 매장 정보 수집·정리
        run: node scripts/batch/collect-exact-address-stores.mjs
        env:
          ADDRESS_SCHEMA_VERSION: "2026-geumdan-gu"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
